name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check shell syntax
        run: bash -n install.sh actualizador.sh
      - name: Run Go tests
        run: go test ./...
      - name: Run go vet
        run: go vet ./...
      - name: Exercise native PostgreSQL installer and saved-config recovery
        shell: bash
        run: |
          set -euo pipefail

          sudo ./install.sh --mode native --postgres install \
            --app-dir /tmp/opentransfer-ci-first/app \
            --config-dir /tmp/opentransfer-ci-first/config \
            --data-dir /tmp/opentransfer-ci-first/data \
            --backup-dir /tmp/opentransfer-ci-first/backups \
            --bind 127.0.0.1 --port 24567 --yes --no-start

          sudo -u postgres createdb --owner=postgres opentransfer_ci
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -d opentransfer_ci -c \
            "CREATE TABLE installer_recovery_probe (value text NOT NULL); INSERT INTO installer_recovery_probe VALUES ('preserved-data');"

          mkdir -p /tmp/opentransfer-ci-second/config /tmp/opentransfer-ci-second/data/files
          ci_key="$(openssl rand -base64 32 | tr -d '\n')"
          cat > /tmp/opentransfer-ci-second/config/instance.env <<EOF
          OT_CONFIG_FILE=/tmp/opentransfer-ci-second/config/instance.env
          OT_LISTEN_ADDR=127.0.0.1:24568
          OT_PUBLIC_URL=http://127.0.0.1:24568
          OT_LOG_LEVEL=info
          OT_DATABASE_URL=postgres://opentransfer_ci:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef@127.0.0.1:5432/opentransfer_ci?sslmode=disable
          OT_STORAGE_BACKEND=local
          OT_STORAGE_LOCAL_PATH=/tmp/opentransfer-ci-second/data/files
          OT_ENCRYPTION_KEY=$ci_key
          OT_BIND_ADDRESS=127.0.0.1
          OT_HTTP_PORT=24568
          OT_POSTGRES_MANAGED=0
          POSTGRES_DB=opentransfer_ci
          POSTGRES_USER=opentransfer_ci
          POSTGRES_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          EOF
          chmod 600 /tmp/opentransfer-ci-second/config/instance.env

          sudo ./install.sh --mode native --postgres install \
            --postgres-db opentransfer_ci --postgres-user opentransfer_ci \
            --app-dir /tmp/opentransfer-ci-second/app \
            --config-dir /tmp/opentransfer-ci-second/config \
            --data-dir /tmp/opentransfer-ci-second/data \
            --backup-dir /tmp/opentransfer-ci-second/backups \
            --bind 127.0.0.1 --port 24568 --yes --no-start

          sudo grep -qx 'OT_POSTGRES_MANAGED=1' /tmp/opentransfer-ci-second/config/instance.env
          sudo grep -qx 'POSTGRES_PASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef' /tmp/opentransfer-ci-second/config/instance.env
          sudo grep -Fqx 'OT_DATABASE_URL=postgres://opentransfer_ci:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef@127.0.0.1:5432/opentransfer_ci?sslmode=disable' /tmp/opentransfer-ci-second/config/instance.env
          sudo find /tmp/opentransfer-ci-second/config -maxdepth 1 -name 'instance.env.backup.*' -print -quit | grep -q .
          db_owner="$(sudo -u postgres psql -X -A -t -c "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'opentransfer_ci'")"
          [[ "$db_owner" == "opentransfer_ci" ]]
          schema_owner="$(sudo -u postgres psql -X -A -t -d opentransfer_ci -c "SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = 'public'")"
          [[ "$schema_owner" == "opentransfer_ci" ]]
          probe="$(PGPASSWORD=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef psql -X -h 127.0.0.1 -p 5432 -U opentransfer_ci -d opentransfer_ci -A -t -v ON_ERROR_STOP=1 -c "SELECT value FROM installer_recovery_probe")"
          [[ "$probe" == "preserved-data" ]]
