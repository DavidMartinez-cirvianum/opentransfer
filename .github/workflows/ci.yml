name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check shell syntax
        run: bash -n install.sh actualizador.sh
      - name: Run Go tests
        run: go test ./...
      - name: Run go vet
        run: go vet ./...
