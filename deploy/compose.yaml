name: opentransfer

services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opentransfer}
      POSTGRES_USER: ${POSTGRES_USER:-opentransfer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the instance configuration}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${OT_POSTGRES_DATA_DIR:-/var/lib/opentransfer/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opentransfer} -d ${POSTGRES_DB:-opentransfer}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - private

  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: ${OT_RELEASE_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    env_file:
      - ${OT_CONFIG_FILE:?Set OT_CONFIG_FILE to the absolute path of instance.env}
    environment:
      OT_LISTEN_ADDR: ":8080"
    ports:
      - "${OT_BIND_ADDRESS:-127.0.0.1}:${OT_HTTP_PORT:-8080}:8080"
    volumes:
      - ${OT_STORAGE_LOCAL_PATH:-/var/lib/opentransfer/files}:${OT_STORAGE_LOCAL_PATH:-/var/lib/opentransfer/files}
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - private

networks:
  private:
    driver: bridge
